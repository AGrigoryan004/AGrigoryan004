<svg width="860" height="320" viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;family=Share+Tech+Mono&amp;display=swap');

      .name-text {
        font-family: 'Orbitron', 'Courier New', monospace;
        font-size: 28px;
        font-weight: 900;
        fill: #E0F8F8;
        letter-spacing: 6px;
        text-anchor: middle;
        filter: url(#glow);
      }
      .subtitle-text {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 11px;
        fill: #5DD5DD;
        letter-spacing: 4px;
        text-anchor: middle;
      }
      .tag-text {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 9px;
        fill: #9EE3E6;
        letter-spacing: 1.5px;
        text-anchor: middle;
      }

      /* Grid fade in */
      .grid-lines { animation: gridFadeIn 1s ease-out 0.4s both; }
      @keyframes gridFadeIn {
        from { opacity: 0; } to { opacity: 1; }
      }

      /* Scan line sweep */
      .scan-line { animation: scanSweep 1.2s linear 0.8s both; }
      @keyframes scanSweep {
        0%  { transform: translateY(0px);   opacity: 0.8; }
        90% { opacity: 0.4; }
        100%{ transform: translateY(320px); opacity: 0; }
      }

      /* Corners pop in */
      .corner { animation: cornerFade 0.4s ease-out both; }
      .c-tl { animation-delay: 2.0s; }
      .c-tr { animation-delay: 2.2s; }
      .c-bl { animation-delay: 2.4s; }
      .c-br { animation-delay: 2.6s; }
      @keyframes cornerFade {
        from { opacity: 0; } to { opacity: 1; }
      }

      /* Name reveal */
      .name-text { animation: nameReveal 0.8s ease-out 3.0s both; }
      @keyframes nameReveal {
        0%  { opacity: 0; filter: url(#glowBlur); }
        60% { opacity: 1; filter: url(#glowBlur); }
        100%{ opacity: 1; filter: url(#glow); }
      }

      /* Name breathing glow loop */
      .name-glow { animation: nameReveal 0.8s ease-out 3.0s both, nameBreath 3s ease-in-out 3.8s infinite; }
      @keyframes nameBreath {
        0%,100% { filter: url(#glow); }
        50%     { filter: url(#glowBright); }
      }

      /* Divider expand */
      .divider { animation: dividerExpand 0.8s ease-out 4.3s both; }
      @keyframes dividerExpand {
        from { transform: scaleX(0); opacity: 0; }
        to   { transform: scaleX(1); opacity: 1; }
      }

      /* Subtitle fade */
      .subtitle-text { animation: subtitleFade 0.8s ease-out 4.8s both; }
      @keyframes subtitleFade {
        from { opacity: 0; } to { opacity: 1; }
      }

      /* Tags stagger */
      .tag-g { animation: tagSlide 0.4s ease-out both; }
      .tag-g:nth-child(1) { animation-delay: 5.2s; }
      .tag-g:nth-child(2) { animation-delay: 5.4s; }
      .tag-g:nth-child(3) { animation-delay: 5.6s; }
      .tag-g:nth-child(4) { animation-delay: 5.8s; }
      .tag-g:nth-child(5) { animation-delay: 6.0s; }
      @keyframes tagSlide {
        from { opacity: 0; transform: translateX(-10px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      /* Continuous scan loop after intro */
      .scan-loop { animation: scanLoop 3s linear 6.5s infinite; }
      @keyframes scanLoop {
        0%  { transform: translateY(0);    opacity: 0.5; }
        90% { opacity: 0.25; }
        100%{ transform: translateY(320px); opacity: 0; }
      }

      /* Energy pulse */
      .e-pulse { animation: ePulse1 4s linear 7s infinite; }
      .e-pulse2 { animation: ePulse1 4s linear 9s infinite; }
      @keyframes ePulse1 {
        0%  { transform: translateY(0);    opacity: 0.6; }
        100%{ transform: translateY(320px); opacity: 0; }
      }

      /* Particle floats */
      .particle { animation: particleFloat both; }
      .p1  { animation-duration: 4s; animation-delay: 2.8s; }
      .p2  { animation-duration: 5s; animation-delay: 3.2s; }
      .p3  { animation-duration: 3.5s; animation-delay: 3.5s; }
      .p4  { animation-duration: 4.5s; animation-delay: 2.9s; }
      .p5  { animation-duration: 3.8s; animation-delay: 3.8s; }
      .p6  { animation-duration: 4.2s; animation-delay: 3.1s; }
      .p7  { animation-duration: 5.2s; animation-delay: 4.0s; }
      .p8  { animation-duration: 3.6s; animation-delay: 4.2s; }
      @keyframes particleFloat {
        0%   { opacity: 0; transform: translateY(0); }
        20%  { opacity: 0.7; }
        100% { opacity: 0; transform: translateY(-80px); }
      }

      /* Central glow */
      .central-glow { animation: centralGlow 1s ease-out 0.2s both; }
      @keyframes centralGlow {
        from { opacity: 0; } to { opacity: 1; }
      }
    </style>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBright" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="scanGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Central radial gradient -->
    <radialGradient id="centralGrad" cx="50%" cy="58%" r="35%">
      <stop offset="0%"   stop-color="#17D4D9" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#119CA4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Scan line gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#17D4D9" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#17D4D9" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#E0F8F8" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#17D4D9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#17D4D9" stop-opacity="0"/>
    </linearGradient>

    <!-- Divider gradient -->
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#17D4D9" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#17D4D9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#17D4D9" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="tagClip1"><polygon points="5,0 120,0 115,18 0,18"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="860" height="320" fill="#000000" rx="12"/>

  <!-- Central glow -->
  <rect class="central-glow" width="860" height="320" fill="url(#centralGrad)" rx="12"/>

  <!-- ===== GRID ===== -->
  <g class="grid-lines" opacity="0">
    <!-- Vanishing point: 430, 185 -->
    <!-- Horizontal floor lines (rows 0-14) -->
    <line x1="430" y1="185" x2="0"   y2="228" stroke="#11575F" stroke-width="0.4" opacity="0.5"/>
    <line x1="430" y1="185" x2="0"   y2="245" stroke="#11575F" stroke-width="0.5" opacity="0.5"/>
    <line x1="430" y1="185" x2="0"   y2="262" stroke="#11575F" stroke-width="0.6" opacity="0.6"/>
    <line x1="430" y1="185" x2="0"   y2="279" stroke="#11575F" stroke-width="0.7" opacity="0.6"/>
    <line x1="430" y1="185" x2="860" y2="228" stroke="#11575F" stroke-width="0.4" opacity="0.5"/>
    <line x1="430" y1="185" x2="860" y2="245" stroke="#11575F" stroke-width="0.5" opacity="0.5"/>
    <line x1="430" y1="185" x2="860" y2="262" stroke="#11575F" stroke-width="0.6" opacity="0.6"/>
    <line x1="430" y1="185" x2="860" y2="279" stroke="#11575F" stroke-width="0.7" opacity="0.6"/>

    <!-- Horizontal lines across -->
    <line x1="62"  y1="228" x2="798" y2="228" stroke="#11575F" stroke-width="0.5" opacity="0.4"/>
    <line x1="30"  y1="245" x2="830" y2="245" stroke="#11575F" stroke-width="0.6" opacity="0.5"/>
    <line x1="0"   y1="262" x2="860" y2="262" stroke="#5DD5DD" stroke-width="0.7" opacity="0.5"/>
    <line x1="0"   y1="279" x2="860" y2="279" stroke="#11575F" stroke-width="0.8" opacity="0.5"/>
    <line x1="0"   y1="296" x2="860" y2="296" stroke="#11575F" stroke-width="0.9" opacity="0.6"/>
    <line x1="0"   y1="320" x2="860" y2="320" stroke="#5DD5DD" stroke-width="1.2" opacity="0.6"/>

    <!-- Vertical converging lines (floor) -->
    <line x1="430" y1="185" x2="0"   y2="320" stroke="#119CA4" stroke-width="0.8" opacity="0.4"/>
    <line x1="430" y1="185" x2="86"  y2="320" stroke="#119CA4" stroke-width="0.7" opacity="0.3"/>
    <line x1="430" y1="185" x2="172" y2="320" stroke="#119CA4" stroke-width="0.6" opacity="0.3"/>
    <line x1="430" y1="185" x2="258" y2="320" stroke="#119CA4" stroke-width="0.5" opacity="0.25"/>
    <line x1="430" y1="185" x2="344" y2="320" stroke="#119CA4" stroke-width="0.4" opacity="0.2"/>
    <line x1="430" y1="185" x2="430" y2="320" stroke="#17D4D9" stroke-width="1.0" opacity="0.5"/>
    <line x1="430" y1="185" x2="516" y2="320" stroke="#119CA4" stroke-width="0.4" opacity="0.2"/>
    <line x1="430" y1="185" x2="602" y2="320" stroke="#119CA4" stroke-width="0.5" opacity="0.25"/>
    <line x1="430" y1="185" x2="688" y2="320" stroke="#119CA4" stroke-width="0.6" opacity="0.3"/>
    <line x1="430" y1="185" x2="774" y2="320" stroke="#119CA4" stroke-width="0.7" opacity="0.3"/>
    <line x1="430" y1="185" x2="860" y2="320" stroke="#119CA4" stroke-width="0.8" opacity="0.4"/>

    <!-- Ceiling/upper grid lines -->
    <line x1="0"   y1="0"   x2="860" y2="0"   stroke="#119CA4" stroke-width="0.3" opacity="0.15"/>
    <line x1="0"   y1="40"  x2="860" y2="40"  stroke="#119CA4" stroke-width="0.3" opacity="0.12"/>
    <line x1="0"   y1="80"  x2="860" y2="80"  stroke="#119CA4" stroke-width="0.3" opacity="0.10"/>
    <line x1="0"   y1="120" x2="860" y2="120" stroke="#119CA4" stroke-width="0.3" opacity="0.08"/>
    <line x1="430" y1="185" x2="0"   y2="0"   stroke="#119CA4" stroke-width="0.5" opacity="0.08"/>
    <line x1="430" y1="185" x2="215" y2="0"   stroke="#119CA4" stroke-width="0.4" opacity="0.07"/>
    <line x1="430" y1="185" x2="645" y2="0"   stroke="#119CA4" stroke-width="0.4" opacity="0.07"/>
    <line x1="430" y1="185" x2="860" y2="0"   stroke="#119CA4" stroke-width="0.5" opacity="0.08"/>

    <!-- Central glow dot -->
    <circle cx="430" cy="185" r="18" fill="none" stroke="#17D4D9" stroke-width="0" opacity="0"/>
    <radialGradient id="dotGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E0F8F8" stop-opacity="0.9"/>
      <stop offset="40%"  stop-color="#17D4D9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#17D4D9" stop-opacity="0"/>
    </radialGradient>
    <circle cx="430" cy="185" r="22" fill="url(#dotGrad)"/>
  </g>

  <!-- ===== SCAN LINE (intro) ===== -->
  <rect class="scan-line" x="0" y="0" width="860" height="2" fill="url(#scanGrad)"/>

  <!-- ===== CORNERS ===== -->
  <g stroke="#17D4D9" stroke-width="2" fill="none" opacity="0">
    <g class="corner c-tl" opacity="0">
      <line x1="14" y1="28" x2="14" y2="14"/>
      <line x1="14" y1="14" x2="28" y2="14"/>
    </g>
    <g class="corner c-tr" opacity="0">
      <line x1="832" y1="14" x2="846" y2="14"/>
      <line x1="846" y1="14" x2="846" y2="28"/>
    </g>
    <g class="corner c-bl" opacity="0">
      <line x1="14" y1="292" x2="14" y2="306"/>
      <line x1="14" y1="306" x2="28" y2="306"/>
    </g>
    <g class="corner c-br" opacity="0">
      <line x1="832" y1="306" x2="846" y2="306"/>
      <line x1="846" y1="292" x2="846" y2="306"/>
    </g>
  </g>

  <!-- ===== PARTICLES ===== -->
  <g>
    <circle class="particle p1" cx="120" cy="240" r="1.5" fill="#17D4D9" opacity="0"/>
    <circle class="particle p2" cx="180" cy="260" r="1"   fill="#5DD5DD" opacity="0"/>
    <circle class="particle p3" cx="90"  cy="270" r="1.8" fill="#17D4D9" opacity="0"/>
    <circle class="particle p4" cx="155" cy="250" r="1.2" fill="#9EE3E6" opacity="0"/>
    <circle class="particle p5" cx="700" cy="245" r="1.5" fill="#17D4D9" opacity="0"/>
    <circle class="particle p6" cx="740" cy="260" r="1"   fill="#5DD5DD" opacity="0"/>
    <circle class="particle p7" cx="680" cy="270" r="1.8" fill="#17D4D9" opacity="0"/>
    <circle class="particle p8" cx="760" cy="250" r="1.2" fill="#9EE3E6" opacity="0"/>
  </g>

  <!-- ===== NAME ===== -->
  <text class="name-glow" x="430" y="150" fill="#E0F8F8"
        font-family="'Orbitron','Courier New',monospace"
        font-size="28" font-weight="900" letter-spacing="6"
        text-anchor="middle"
        filter="url(#glow)"
        opacity="0">
    ARTASHES GRIGORYAN
  </text>

  <!-- ===== DIVIDER ===== -->
  <rect class="divider" x="320" y="163" width="220" height="1"
        fill="url(#divGrad)" transform-origin="430 163" opacity="0"/>

  <!-- ===== SUBTITLE ===== -->
  <text class="subtitle-text" x="430" y="182"
        font-family="'Share Tech Mono','Courier New',monospace"
        font-size="11" letter-spacing="3" fill="#5DD5DD"
        text-anchor="middle" opacity="0">
    ARTIFICIAL INTELLIGENCE SYSTEMS DEVELOPER
  </text>

  <!-- ===== TAGS ===== -->
  <g>
    <!-- MACHINE LEARNING -->
    <g class="tag-g" opacity="0">
      <polygon points="80,201 196,201 191,216 75,216" fill="rgba(23,212,217,0.06)" stroke="#119CA4" stroke-width="1"/>
      <text x="135" y="212" font-family="'Share Tech Mono','Courier New',monospace" font-size="9" letter-spacing="1.5" fill="#9EE3E6" text-anchor="middle">MACHINE LEARNING</text>
    </g>
    <!-- LLMs -->
    <g class="tag-g" opacity="0">
      <polygon points="203,201 253,201 248,216 198,216" fill="rgba(23,212,217,0.06)" stroke="#119CA4" stroke-width="1"/>
      <text x="225" y="212" font-family="'Share Tech Mono','Courier New',monospace" font-size="9" letter-spacing="1.5" fill="#9EE3E6" text-anchor="middle">LLMs</text>
    </g>
    <!-- NLP -->
    <g class="tag-g" opacity="0">
      <polygon points="260,201 305,201 300,216 255,216" fill="rgba(23,212,217,0.06)" stroke="#119CA4" stroke-width="1"/>
      <text x="280" y="212" font-family="'Share Tech Mono','Courier New',monospace" font-size="9" letter-spacing="1.5" fill="#9EE3E6" text-anchor="middle">NLP</text>
    </g>
    <!-- COMPUTER VISION -->
    <g class="tag-g" opacity="0">
      <polygon points="312,201 447,201 442,216 307,216" fill="rgba(23,212,217,0.06)" stroke="#119CA4" stroke-width="1"/>
      <text x="377" y="212" font-family="'Share Tech Mono','Courier New',monospace" font-size="9" letter-spacing="1.5" fill="#9EE3E6" text-anchor="middle">COMPUTER VISION</text>
    </g>
    <!-- RAG -->
    <g class="tag-g" opacity="0">
      <polygon points="454,201 499,201 494,216 449,216" fill="rgba(23,212,217,0.06)" stroke="#119CA4" stroke-width="1"/>
      <text x="474" y="212" font-family="'Share Tech Mono','Courier New',monospace" font-size="9" letter-spacing="1.5" fill="#9EE3E6" text-anchor="middle">RAG</text>
    </g>
  </g>

  <!-- ===== LOOPING SCAN + ENERGY PULSE ===== -->
  <rect class="scan-loop" x="0" y="0" width="860" height="2" fill="url(#scanGrad)" opacity="0"/>
  <rect class="e-pulse"  x="0" y="0" width="860" height="1.5" fill="url(#scanGrad)" opacity="0"/>
  <rect class="e-pulse2" x="0" y="0" width="860" height="1"   fill="url(#scanGrad)" opacity="0"/>

</svg>
