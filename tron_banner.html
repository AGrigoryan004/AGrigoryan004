
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .boot-wrap {
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    width: 100%;
    height: 320px;
    font-family: 'Orbitron', sans-serif;
  }

  canvas#bootCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .boot-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  .name-wrap {
    position: relative;
    display: inline-block;
  }

  .tron-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #E0F8F8;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0;
    display: flex;
    gap: 0px;
    filter: blur(2px);
    transition: filter 0.5s;
  }

  .tron-name.revealed {
    filter: blur(0px);
  }

  .tron-name .letter {
    display: inline-block;
    opacity: 0;
    color: #E0F8F8;
    text-shadow: 0 0 8px #17D4D9, 0 0 20px #119CA4;
    position: relative;
  }

  .tron-subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: #5DD5DD;
    letter-spacing: 4px;
    margin-top: 10px;
    opacity: 0;
    text-transform: uppercase;
  }

  .tron-divider {
    width: 0px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #17D4D9, transparent);
    margin: 12px auto;
    opacity: 0;
    transition: width 0.8s ease, opacity 0.3s;
  }

  .tron-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 14px;
  }

  .tron-tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: #9EE3E6;
    border: 1px solid #119CA4;
    padding: 3px 9px;
    letter-spacing: 1.5px;
    clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%);
    background: rgba(23, 212, 217, 0.06);
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity 0.4s, transform 0.4s;
  }

  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, #17D4D9 40%, #E0F8F8 50%, #17D4D9 60%, transparent 100%);
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    top: 0;
  }

  .corner {
    position: absolute;
    width: 20px; height: 20px;
    border-color: #17D4D9;
    border-style: solid;
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 15;
  }
  .corner-tl { top: 14px; left: 14px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 14px; right: 14px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 14px; left: 14px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 14px; right: 14px; border-width: 0 2px 2px 0; }

  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 8px #17D4D9, 0 0 20px #119CA4; }
    50% { text-shadow: 0 0 16px #5DD5DD, 0 0 40px #17D4D9, 0 0 2px #E0F8F8; }
  }

  .breathing .letter {
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes scanAnim {
    0% { top: 0%; opacity: 0.5; }
    90% { opacity: 0.3; }
    100% { top: 100%; opacity: 0; }
  }

  .scan-active {
    animation: scanAnim 2.5s linear infinite;
  }
</style>

<div class="boot-wrap" id="bootWrap">
  <canvas id="bootCanvas"></canvas>
  <div class="scan-line" id="scanLine"></div>
  <div class="corner corner-tl" id="c-tl"></div>
  <div class="corner corner-tr" id="c-tr"></div>
  <div class="corner corner-bl" id="c-bl"></div>
  <div class="corner corner-br" id="c-br"></div>
  <div class="boot-overlay">
    <div class="name-wrap">
      <div class="tron-name" id="tronName"></div>
    </div>
    <div class="tron-divider" id="tronDivider"></div>
    <div class="tron-subtitle" id="tronSubtitle">ARTIFICIAL INTELLIGENCE SYSTEMS DEVELOPER</div>
    <div class="tron-tags" id="tronTags">
      <span class="tron-tag">MACHINE LEARNING</span>
      <span class="tron-tag">LLMs</span>
      <span class="tron-tag">NLP</span>
      <span class="tron-tag">COMPUTER VISION</span>
      <span class="tron-tag">RAG</span>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('bootCanvas');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('bootWrap');

  function resize() {
    canvas.width = wrap.offsetWidth;
    canvas.height = wrap.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const colors = {
    bg: '#000000',
    grid: '#0C3A40',
    gridBright: '#119CA4',
    neon: '#17D4D9',
    light: '#5DD5DD',
    highlight: '#9EE3E6',
    white: '#E0F8F8'
  };

  const VP_X = 0.5;
  const VP_Y = 0.58;
  const COLS = 20;
  const ROWS = 14;

  let gridAlpha = 0;
  let centralGlowAlpha = 0;
  let particleAlpha = 0;
  let particles = [];
  let t = 0;
  let phase = 'glow';
  let phaseStart = 0;
  let energyPulses = [];

  function createParticle() {
    const W = canvas.width;
    const H = canvas.height;
    const side = Math.random() < 0.5 ? 'left' : 'right';
    return {
      x: side === 'left' ? Math.random() * W * 0.4 : W * 0.6 + Math.random() * W * 0.4,
      y: H * (0.3 + Math.random() * 0.6),
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.5 - Math.random() * 1.2,
      life: 1,
      decay: 0.008 + Math.random() * 0.012,
      size: 1 + Math.random() * 1.5,
      color: Math.random() < 0.5 ? colors.neon : colors.light
    };
  }

  for (let i = 0; i < 40; i++) particles.push(createParticle());

  function createEnergyPulse() {
    return { progress: 0, row: Math.floor(Math.random() * ROWS), alpha: 0.6 + Math.random() * 0.4 };
  }

  function drawScene(alpha, particleA) {
    const W = canvas.width;
    const H = canvas.height;
    const vx = W * VP_X;
    const vy = H * VP_Y;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, W, H);

    if (centralGlowAlpha > 0) {
      const grd = ctx.createRadialGradient(vx, vy, 0, vx, vy, W * 0.35);
      grd.addColorStop(0, `rgba(23,212,217,${0.22 * centralGlowAlpha})`);
      grd.addColorStop(0.5, `rgba(17,156,164,${0.08 * centralGlowAlpha})`);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);
    }

    if (alpha > 0) {
      for (let r = 0; r <= ROWS; r++) {
        const progress = r / ROWS;
        const py = vy + (H - vy) * progress;
        const spread = (py - vy) / (H - vy);
        const lx = vx - spread * vx;
        const rx = vx + spread * (W - vx);
        const lineAlpha = (0.08 + progress * 0.45) * alpha;
        const isLast = r === ROWS;
        ctx.strokeStyle = `rgba(${isLast ? '93,213,221' : '17,87,97'},${lineAlpha})`;
        ctx.lineWidth = progress * 1.1;
        ctx.beginPath();
        ctx.moveTo(lx, py);
        ctx.lineTo(rx, py);
        ctx.stroke();
      }

      for (let c = 0; c <= COLS; c++) {
        const t_val = c / COLS;
        const bx = t_val * W;
        const isCenterish = Math.abs(t_val - VP_X) < 0.05;
        const lineAlpha = (isCenterish ? 0.6 : 0.10 + Math.pow(Math.abs(t_val - 0.5), 2) * 0.3) * alpha;
        ctx.strokeStyle = `rgba(17,156,164,${lineAlpha})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        ctx.lineTo(bx, H);
        ctx.stroke();
      }

      for (let r2 = 0; r2 <= 8; r2++) {
        const progress = r2 / 8;
        const py = vy - (vy * 0.85) * progress;
        const spread = (vy - py) / vy;
        const lx = vx - spread * vx * 1.1;
        const rx = vx + spread * (W - vx) * 1.1;
        ctx.strokeStyle = `rgba(17,156,164,${(0.05 + progress * 0.14) * alpha})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(lx, py);
        ctx.lineTo(rx, py);
        ctx.stroke();
      }

      for (let c = 0; c <= 14; c++) {
        const t_val = c / 14;
        ctx.strokeStyle = `rgba(17,156,164,${0.07 * alpha})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        ctx.lineTo(t_val * W, 0);
        ctx.stroke();
      }

      energyPulses.forEach(pulse => {
        const progress = pulse.progress;
        const py = vy + (H - vy) * progress;
        const spread = (py - vy) / (H - vy);
        const lx = vx - spread * vx;
        const rx = vx + spread * (W - vx);
        const pAlpha = pulse.alpha * alpha * (1 - pulse.progress);
        ctx.strokeStyle = `rgba(224,248,248,${pAlpha * 0.5})`;
        ctx.lineWidth = 1.5;
        ctx.shadowColor = '#17D4D9';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.moveTo(lx, py);
        ctx.lineTo(rx, py);
        ctx.stroke();
        ctx.shadowBlur = 0;
      });

      const streak = (Math.sin(t * 0.025) + 1) / 2;
      const sy = vy + (H - vy) * streak;
      const sp = streak;
      ctx.strokeStyle = `rgba(224,248,248,${0.2 * (1 - streak) * alpha})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(vx - sp * vx, sy);
      ctx.lineTo(vx + sp * (W - vx), sy);
      ctx.stroke();

      ctx.strokeStyle = `rgba(23,212,217,${0.5 * alpha})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(vx, vy);
      ctx.lineTo(vx, H);
      ctx.stroke();
    }

    if (particleA > 0) {
      particles.forEach(p => {
        ctx.globalAlpha = p.life * 0.75 * particleA;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    if (centralGlowAlpha > 0) {
      const cg = ctx.createRadialGradient(vx, vy, 0, vx, vy, 28);
      cg.addColorStop(0, `rgba(224,248,248,${0.9 * centralGlowAlpha})`);
      cg.addColorStop(0.35, `rgba(23,212,217,${0.45 * centralGlowAlpha})`);
      cg.addColorStop(1, 'rgba(23,212,217,0)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(vx, vy, 28, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const nameEl = document.getElementById('tronName');
  const subtitleEl = document.getElementById('tronSubtitle');
  const dividerEl = document.getElementById('tronDivider');
  const tagsEl = document.getElementById('tronTags');
  const scanLine = document.getElementById('scanLine');
  const corners = ['c-tl','c-tr','c-bl','c-br'].map(id => document.getElementById(id));

  const nameText = 'ARTASHES GRIGORYAN';
  nameEl.innerHTML = nameText.split('').map(ch =>
    ch === ' ' ? '<span class="letter" style="width:14px;display:inline-block">&nbsp;</span>'
               : `<span class="letter">${ch}</span>`
  ).join('');
  nameEl.style.opacity = '1';
  const letters = nameEl.querySelectorAll('.letter');

  let lettersRevealed = false;
  let allLettersOut = false;

  function revealLetters() {
    letters.forEach((l, i) => {
      let flickerCount = 0;
      const delay = i * 55;
      setTimeout(() => {
        const interval = setInterval(() => {
          const on = Math.random() > 0.4;
          l.style.opacity = on ? '1' : '0.1';
          l.style.color = on ? '#E0F8F8' : '#17D4D9';
          flickerCount++;
          if (flickerCount > 4) {
            clearInterval(interval);
            l.style.opacity = '1';
            l.style.color = '#E0F8F8';
            if (i === letters.length - 1) {
              nameEl.classList.add('revealed', 'breathing');
              allLettersOut = true;
            }
          }
        }, 60);
      }, delay);
    });
  }

  let scanDone = false;
  let cornersLit = 0;
  let tagsShown = false;

  function litCorner(idx) {
    setTimeout(() => { corners[idx].style.opacity = '1'; }, idx * 180);
  }

  function showTags() {
    const tags = tagsEl.querySelectorAll('.tron-tag');
    tags.forEach((tag, i) => {
      setTimeout(() => {
        tag.style.opacity = '1';
        tag.style.transform = 'translateX(0)';
      }, i * 140);
    });
  }

  const timeline = [
    { at: 200,  fn: () => { centralGlowAlpha = 0.3; } },
    { at: 600,  fn: () => { centralGlowAlpha = 0.8; } },
    { at: 1000, fn: () => {
        scanLine.style.opacity = '1';
        scanLine.style.top = '0';
        scanLine.style.transition = 'top 1.1s linear';
        setTimeout(() => { scanLine.style.top = '100%'; }, 50);
        setTimeout(() => { scanLine.style.opacity = '0'; }, 1150);
    }},
    { at: 1400, fn: () => { gridAlpha = 0; phase = 'fadeGrid'; phaseStart = performance.now(); } },
    { at: 2400, fn: () => { corners.forEach((_, i) => litCorner(i)); } },
    { at: 2900, fn: () => { particleAlpha = 0; phase = 'fadeParticles'; phaseStart = performance.now(); } },
    { at: 3300, fn: () => { revealLetters(); } },
    { at: 4600, fn: () => {
        dividerEl.style.opacity = '1';
        dividerEl.style.width = '220px';
    }},
    { at: 5000, fn: () => {
        subtitleEl.style.transition = 'opacity 0.8s ease';
        subtitleEl.style.opacity = '1';
    }},
    { at: 5600, fn: () => { showTags(); } },
    { at: 6500, fn: () => {
        scanLine.style.opacity = '1';
        scanLine.classList.add('scan-active');
        energyPulses.push(createEnergyPulse());
    }},
  ];

  const startTime = performance.now();
  let fired = new Set();

  function animate(now) {
    t++;
    const elapsed = now - startTime;

    timeline.forEach((event, i) => {
      if (!fired.has(i) && elapsed >= event.at) {
        fired.add(i);
        event.fn();
      }
    });

    if (phase === 'fadeGrid') {
      const dur = 1000;
      gridAlpha = Math.min((now - phaseStart) / dur, 1);
      if (gridAlpha >= 1) phase = 'grid';
    }

    if (phase === 'fadeParticles') {
      const dur = 600;
      particleAlpha = Math.min((now - phaseStart) / dur, 1);
      if (particleAlpha >= 1) phase = 'running';
    }

    energyPulses.forEach((p, i) => {
      p.progress += 0.008;
      if (p.progress > 1) energyPulses.splice(i, 1);
    });

    if (Math.random() < 0.008 && elapsed > 6500) {
      energyPulses.push(createEnergyPulse());
    }

    particles.forEach((p, i) => {
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) particles[i] = createParticle();
    });

    drawScene(gridAlpha, particleAlpha);
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
